<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 100vh;
            background-color: #0d0e11;
            background-image: radial-gradient(circle at 50% 30%, rgba(45, 55, 75, 0.45) 0%, rgba(13, 14, 17, 0.98) 72%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-pattern img {
            position: absolute;
            width: 24px;
            height: 24px;
            opacity: 0.16;
            transform: translate(-50%, -50%);
            filter: grayscale(100%) brightness(1.2);
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 18px;
            gap: 12px;
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            z-index: 10;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.15s ease;
        }
        .icon-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
            z-index: 5;
        }
        .rocket-container {
            width: 190px;
            height: 190px;
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            filter: drop-shadow(0px 10px 30px rgba(0, 0, 0, 0.7));
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .floating {
            animation: float 2.6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) scale(1.05); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.08); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.12); }
            40%, 60% { transform: translate3d(6px, 0, 0) scale(1.12); }
        }
        .stars-counter {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0px 4px 18px rgba(0, 0, 0, 0.8);
        }
        /* Блок иксов — появляется ТОЛЬКО во время ивента */
        .multiplier-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 5px 14px 5px 10px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            min-height: 42px;
        }
        .multiplier-badge.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .multiplier {
            font-size: 19px;
            color: #e2e4e9;
            font-weight: 600;
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s ease;
        }
        .crashed-text {
            color: #ff453a !important;
            font-weight: 700;
        }
        .cashed-text {
            color: #30d158 !important;
            font-weight: 700;
        }
        .button-container {
            padding: 16px 22px 28px 22px;
            width: 100%;
            background: transparent;
            z-index: 10;
        }
        .action-button {
            width: 100%;
            height: 56px;
            background-color: #ffffff !important;
            color: #0b0c0e !important;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .action-button:active {
            transform: scale(0.97);
            opacity: 0.92;
        }
        #btnText {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Фон из скриншотов -->
    <div class="bg-pattern" id="bgPattern"></div>

    <!-- Верхняя панель закрытия -->
    <div class="top-bar">
        <div class="icon-btn" onclick="toggleMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
        </div>
        <div class="icon-btn" onclick="closeApp()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
    </div>

    <div class="content">
        <!-- АНИМИРОВАННАЯ РАКЕТКА / ВЗРЫВ -->
        <div class="rocket-container floating" id="rocketContainer">
            <lottie-player id="mainAnimation" src="./rocket.json" background="transparent" speed="1" style="width: 190px; height: 190px;" loop autoplay></lottie-player>
        </div>

        <!-- СЧЕТЧИК ЗВЕЗД (ЧИСТЫЕ ЦЕЛЫЕ ЧИСЛА 1, 2, 3...) -->
        <div class="stars-counter">
            <lottie-player src="./star.json" background="transparent" speed="1" style="width: 42px; height: 42px;" loop autoplay></lottie-player>
            <span id="starsVal">1</span>
        </div>

        <!-- ИКСЫ С ЧАЙНИКОМ (ПОЯВЛЯЮТСЯ ТОЛЬКО ВО ВРЕМЯ ИВЕНТА) -->
        <div class="multiplier-badge" id="multiplierBadge">
            <lottie-player src="./gift_kettle.json" background="transparent" speed="1" style="width: 32px; height: 32px; opacity: 0.55;" loop autoplay></lottie-player>
            <div class="multiplier" id="multiplierVal">x1.00</div>
        </div>
    </div>

    <!-- КНОПКА ДЕЙСТВИЯ (ЧИСТО БЕЛАЯ, ЧЕРНЫЙ ТЕКСТ) -->
    <div class="button-container">
        <button class="action-button" id="actionBtn" onclick="handleButtonClick()">
            <lottie-player id="btnLottie" src="./gift_pepe.json" background="transparent" speed="1" style="width: 32px; height: 32px;" loop autoplay></lottie-player>
            <span id="btnText">Полетели</span>
        </button>
    </div>
</div>

<script>
    // Инициализация Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    function closeApp() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.close();
        }
    }

    function toggleMenu() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }

    // Точные координаты фона из оригинала
    const iconCoords = [
        { left: "14.6%", top: "7%" },
        { left: "50.0%", top: "5%" },
        { left: "82.1%", top: "9%" },
        
        { left: "36.0%", top: "12%" },
        { left: "64.0%", top: "12%" },

        { left: "27.2%", top: "19%" },
        { left: "68.6%", top: "20%" },
        
        { left: "9.9%",  top: "27%" },
        { left: "84.4%", top: "27%" },
        
        { left: "7.0%",  top: "40%" },
        { left: "26.8%", top: "38%" },
        { left: "69.0%", top: "38%" },
        { left: "92.0%", top: "40%" },
        
        { left: "17.0%", top: "49%" },
        { left: "77.3%", top: "49%" },
        { left: "29.2%", top: "55%" },
        
        { left: "11.8%", top: "65%" },
        { left: "48.0%", top: "68%" },
        { left: "83.6%", top: "65%" },

        { left: "25.0%", top: "75%" },
        { left: "72.0%", top: "75%" }
    ];

    const bgContainer = document.getElementById('bgPattern');
    iconCoords.forEach(pos => {
        const img = document.createElement('img');
        img.src = './bg_pattern.webp';
        img.style.left = pos.left;
        img.style.top = pos.top;
        bgContainer.appendChild(img);
    });

    // ИГРОВАЯ МЕХАНИКА
    let multiplier = 1.00;
    let stars = 1;
    let starTimer = 0;
    let gameState = 'ready'; // 'ready', 'flying', 'crashed', 'cashed'
    let crashPoint = 0;
    let animFrame = null;
    let lastTime = 0;

    const multiplierBadge = document.getElementById('multiplierBadge');
    const multiplierEl = document.getElementById('multiplierVal');
    const starsEl = document.getElementById('starsVal');
    const rocketContainer = document.getElementById('rocketContainer');
    const mainAnimation = document.getElementById('mainAnimation');
    const actionBtn = document.getElementById('actionBtn');
    const btnLottie = document.getElementById('btnLottie');
    const btnText = document.getElementById('btnText');

    function triggerHaptic(type) {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            if (type === 'crash') {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            } else if (type === 'success') {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else if (type === 'tick') {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            } else {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    }

    // Исходное состояние (до старта ивента)
    function initReadyState() {
        gameState = 'ready';
        multiplier = 1.00;
        stars = 1;

        // Звезды: просто 1
        starsEl.innerText = '1';

        // ИКСЫ СКРЫТЫ — появляются только во время ивента
        multiplierBadge.className = 'multiplier-badge';
        multiplierEl.innerText = 'x1.00';
        multiplierEl.className = 'multiplier';

        mainAnimation.load('./rocket.json');
        rocketContainer.className = 'rocket-container floating';

        // Кнопка запустить с Пепе
        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Полетели';
    }

    // Запуск полета (старт ивента)
    function startFlight() {
        gameState = 'flying';
        multiplier = 1.00;
        stars = 1;
        starTimer = 0;
        lastTime = performance.now();
        triggerHaptic('start');

        // Случайный краш от 1.50x до 5.80x
        crashPoint = parseFloat((1.50 + Math.random() * 4.30).toFixed(2));

        // ИКСЫ ПОЯВЛЯЮТСЯ во время ивента
        multiplierBadge.className = 'multiplier-badge visible';
        multiplierEl.innerText = 'x1.00';
        multiplierEl.className = 'multiplier';

        // Кнопка переключается на Забрать с Клевером
        btnLottie.load('./gift_clover.json');
        btnText.innerText = 'Забрать (' + stars + ')';

        loop(performance.now());
    }

    function loop(currentTime) {
        if (gameState !== 'flying') return;

        const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;

        // МЕДЛЕННЫЙ, ПЛАВНЫЙ РОСТ ИКСОВ
        // Растет плавно и неспешно, нарастает постепенно
        const growthRate = 0.08 + (multiplier - 1.0) * 0.055;
        multiplier += growthRate * delta;

        // ЗВЕЗДЫ РАСТУТ ПО ЦЕЛЫМ ЧИСЛАМ: 1, 2, 3, 4, 5...
        // Каждые ~0.25 сек прибавляется 1 звезда (с ускорением по иксам)
        starTimer += delta * (1.8 + (multiplier - 1.0) * 1.5);
        if (starTimer >= 1) {
            stars += Math.floor(starTimer);
            starTimer = starTimer % 1;
            starsEl.innerText = stars;
            triggerHaptic('tick');
        }

        multiplierEl.innerText = 'x' + multiplier.toFixed(2);
        btnText.innerText = 'Забрать (' + stars + ')';

        if (multiplier >= crashPoint) {
            triggerCrash();
        } else {
            animFrame = requestAnimationFrame(loop);
        }
    }

    function triggerCrash() {
        gameState = 'crashed';
        cancelAnimationFrame(animFrame);
        triggerHaptic('crash');

        // Взрыв: огонь Telegram
        mainAnimation.load('./fire.json');
        rocketContainer.className = 'rocket-container shake';

        multiplierEl.innerText = 'ВЗОРВАЛСЯ @ x' + crashPoint.toFixed(2);
        multiplierEl.className = 'multiplier crashed-text';

        // Кнопка повтора с Пепе
        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Попробовать снова';
    }

    function claimWin() {
        if (gameState !== 'flying') return;
        gameState = 'cashed';
        cancelAnimationFrame(animFrame);
        triggerHaptic('success');

        multiplierEl.innerText = 'ЗАБРАЛ @ x' + multiplier.toFixed(2);
        multiplierEl.className = 'multiplier cashed-text';

        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Забрал ' + stars + ' звезд — Еще раз';
    }

    function handleButtonClick() {
        if (gameState === 'ready') {
            startFlight();
        } else if (gameState === 'flying') {
            claimWin();
        } else {
            initReadyState();
        }
    }

    // Исходное состояние при загрузке
    initReadyState();
</script>
</body>
</html>
