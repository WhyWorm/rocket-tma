<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 100vh;
            background-color: #0b0c0e;
            background-image: radial-gradient(circle at 50% 32%, rgba(35, 48, 72, 0.4) 0%, rgba(11, 12, 14, 0.98) 75%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Apple iOS Sheet Grabber */
        .ios-grabber {
            width: 36px;
            height: 4.5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.22);
            margin: 8px auto 0 auto;
            z-index: 20;
            position: relative;
        }

        /* Apple Dynamic Island / Live Activity Capsule */
        .dynamic-island {
            margin: 6px auto 0 auto;
            background: #000000;
            border: 0.5px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 5px 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.22);
            z-index: 18;
            transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .di-dot {
            width: 6.5px;
            height: 6.5px;
            border-radius: 50%;
            background: #30d158;
            box-shadow: 0 0 8px #30d158;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .di-dot.pulsing {
            animation: pulse-dot 1.2s infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.35); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        .di-text {
            font-size: 11.5px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.1px;
            font-variant-numeric: tabular-nums;
        }

        /* Background Pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-pattern img {
            position: absolute;
            width: 24px;
            height: 24px;
            opacity: 0.15;
            transform: translate(-50%, -50%);
            filter: grayscale(100%) brightness(1.2);
        }

        /* Apple Top Controls */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 18px;
            gap: 10px;
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            z-index: 15;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .icon-btn:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.94);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 24px;
            z-index: 5;
            position: relative;
        }

        /* Apple Warp Aura Glow behind Rocket */
        .warp-glow {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.28) 0%, rgba(94, 92, 230, 0.12) 45%, rgba(0, 0, 0, 0) 70%);
            filter: blur(20px);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.5s cubic-bezier(0.32, 0.72, 0, 1), transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
            z-index: 1;
        }
        .warp-glow.active {
            opacity: 1;
            transform: scale(1.15);
            animation: pulse-warp 1.8s ease-in-out infinite alternate;
        }
        @keyframes pulse-warp {
            0% { transform: scale(1.08); filter: blur(18px); }
            100% { transform: scale(1.28); filter: blur(26px); }
        }

        .rocket-container {
            width: 190px;
            height: 190px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 12px 32px rgba(0, 0, 0, 0.8));
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .floating {
            animation: float 2.6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) scale(1.05); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.08); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.12); }
            40%, 60% { transform: translate3d(6px, 0, 0) scale(1.12); }
        }

        /* Counter */
        .stars-counter {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            letter-spacing: -0.6px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.85);
            z-index: 3;
        }

        /* Apple Frosted Glass Badge for Multiplier (Hidden until event) */
        .multiplier-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 6px 16px 6px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 0.5px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.25);
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1), transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            min-height: 44px;
            z-index: 3;
        }
        .multiplier-badge.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .multiplier {
            font-size: 19px;
            color: #f2f3f5;
            font-weight: 600;
            letter-spacing: -0.2px;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s ease;
        }
        .crashed-text {
            color: #ff453a !important;
            font-weight: 700;
        }
        .cashed-text {
            color: #30d158 !important;
            font-weight: 700;
        }

        /* Apple Style Action Button */
        .button-container {
            padding: 16px 22px 30px 22px;
            width: 100%;
            background: transparent;
            z-index: 10;
        }
        .action-button {
            width: 100%;
            height: 56px;
            background: #ffffff !important;
            color: #000000 !important;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: transform 0.12s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .action-button:active {
            transform: scale(0.96);
            opacity: 0.92;
        }
        #btnText {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- iOS Sheet Grabber -->
    <div class="ios-grabber"></div>

    <!-- Apple Dynamic Island / Live Activity -->
    <div class="dynamic-island" id="dynamicIsland">
        <div class="di-dot" id="diDot"></div>
        <span class="di-text" id="diText">Ready to Launch</span>
    </div>

    <!-- Background Pattern -->
    <div class="bg-pattern" id="bgPattern"></div>

    <!-- Top Bar Controls -->
    <div class="top-bar">
        <div class="icon-btn" onclick="toggleMenu()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
        </div>
        <div class="icon-btn" onclick="closeApp()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
    </div>

    <div class="content">
        <!-- Space Warp Glow behind Rocket -->
        <div class="warp-glow" id="warpGlow"></div>

        <!-- АНИМИРОВАННАЯ РАКЕТКА / ВЗРЫВ -->
        <div class="rocket-container floating" id="rocketContainer">
            <lottie-player id="mainAnimation" src="./rocket.json" background="transparent" speed="1" style="width: 190px; height: 190px;" loop autoplay></lottie-player>
        </div>

        <!-- СЧЕТЧИК ЗВЕЗД (ЧИСТЫЕ ЦЕЛЫЕ ЧИСЛА 1, 2, 3...) -->
        <div class="stars-counter">
            <lottie-player src="./star.json" background="transparent" speed="1" style="width: 44px; height: 44px;" loop autoplay></lottie-player>
            <span id="starsVal">1</span>
        </div>

        <!-- ИКСЫ С ЧАЙНИКОМ (ПОЯВЛЯЮТСЯ ТОЛЬКО ВО ВРЕМЯ ИВЕНТА) -->
        <div class="multiplier-badge" id="multiplierBadge">
            <lottie-player src="./gift_kettle.json" background="transparent" speed="1" style="width: 32px; height: 32px; opacity: 0.55;" loop autoplay></lottie-player>
            <div class="multiplier" id="multiplierVal">x1.00</div>
        </div>
    </div>

    <!-- КНОПКА ДЕЙСТВИЯ (ЧИСТО БЕЛАЯ, ЧЕРНЫЙ ТЕКСТ) -->
    <div class="button-container">
        <button class="action-button" id="actionBtn" onclick="handleButtonClick()">
            <lottie-player id="btnLottie" src="./gift_pepe.json" background="transparent" speed="1" style="width: 32px; height: 32px;" loop autoplay></lottie-player>
            <span id="btnText">Полетели</span>
        </button>
    </div>
</div>

<script>
    // Инициализация Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    function closeApp() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.close();
        }
    }

    function toggleMenu() {
        triggerHaptic('click');
    }

    // ==========================================
    // Apple Sound Synthesizer (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // Тонкий тактильный клик при наборе звезды
    function playStarTickSound() {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 0.035);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
    }

    // Фирменный двойной Apple Pay колокольчик на выигрыш (D5 -> A5)
    function playAppleSuccessChime() {
        try {
            const ctx = getAudioCtx();
            // Нота 1
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain1.gain.setValueAtTime(0.12, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start();
            osc1.stop(ctx.currentTime + 0.28);

            // Нота 2 (октава)
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.11);
            gain2.gain.setValueAtTime(0.15, ctx.currentTime + 0.11);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(ctx.currentTime + 0.11);
            osc2.stop(ctx.currentTime + 0.45);
        } catch(e) {}
    }

    // Мягкий электронный бас-краш
    function playCrashSound() {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
        } catch(e) {}
    }

    // ==========================================
    // Фон из оригинальных скриншотов
    // ==========================================
    const iconCoords = [
        { left: "14.6%", top: "7%" },
        { left: "50.0%", top: "5%" },
        { left: "82.1%", top: "9%" },
        
        { left: "36.0%", top: "12%" },
        { left: "64.0%", top: "12%" },

        { left: "27.2%", top: "19%" },
        { left: "68.6%", top: "20%" },
        
        { left: "9.9%",  top: "27%" },
        { left: "84.4%", top: "27%" },
        
        { left: "7.0%",  top: "40%" },
        { left: "26.8%", top: "38%" },
        { left: "69.0%", top: "38%" },
        { left: "92.0%", top: "40%" },
        
        { left: "17.0%", top: "49%" },
        { left: "77.3%", top: "49%" },
        { left: "29.2%", top: "55%" },
        
        { left: "11.8%", top: "65%" },
        { left: "48.0%", top: "68%" },
        { left: "83.6%", top: "65%" },

        { left: "25.0%", top: "75%" },
        { left: "72.0%", top: "75%" }
    ];

    const bgContainer = document.getElementById('bgPattern');
    iconCoords.forEach(pos => {
        const img = document.createElement('img');
        img.src = './bg_pattern.webp';
        img.style.left = pos.left;
        img.style.top = pos.top;
        bgContainer.appendChild(img);
    });

    // ==========================================
    // Игровая логика
    // ==========================================
    let multiplier = 1.00;
    let stars = 1;
    let starTimer = 0;
    let gameState = 'ready';
    let crashPoint = 0;
    let animFrame = null;
    let lastTime = 0;

    const dynamicIsland = document.getElementById('dynamicIsland');
    const diDot = document.getElementById('diDot');
    const diText = document.getElementById('diText');

    const warpGlow = document.getElementById('warpGlow');
    const multiplierBadge = document.getElementById('multiplierBadge');
    const multiplierEl = document.getElementById('multiplierVal');
    const starsEl = document.getElementById('starsVal');
    const rocketContainer = document.getElementById('rocketContainer');
    const mainAnimation = document.getElementById('mainAnimation');
    const actionBtn = document.getElementById('actionBtn');
    const btnLottie = document.getElementById('btnLottie');
    const btnText = document.getElementById('btnText');

    function triggerHaptic(type) {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            if (type === 'crash') {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            } else if (type === 'success') {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else if (type === 'tick') {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            } else {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    }

    // Исходное состояние
    function initReadyState() {
        gameState = 'ready';
        multiplier = 1.00;
        stars = 1;

        // Dynamic Island: Готов
        diDot.style.background = '#30d158';
        diDot.style.boxShadow = '0 0 8px #30d158';
        diDot.className = 'di-dot';
        diText.innerText = 'Ready to Launch';

        // Звезды
        starsEl.innerText = '1';

        // Свечение варпа выключено
        warpGlow.className = 'warp-glow';

        // Иксы скрыты
        multiplierBadge.className = 'multiplier-badge';
        multiplierEl.innerText = 'x1.00';
        multiplierEl.className = 'multiplier';

        mainAnimation.load('./rocket.json');
        rocketContainer.className = 'rocket-container floating';

        // Кнопка запустить с Пепе
        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Полетели';
    }

    // Запуск полета (старт ивента)
    function startFlight() {
        getAudioCtx();
        gameState = 'flying';
        multiplier = 1.00;
        stars = 1;
        starTimer = 0;
        lastTime = performance.now();
        triggerHaptic('start');

        // Dynamic Island: В полете
        diDot.style.background = '#32ade6';
        diDot.style.boxShadow = '0 0 10px #32ade6';
        diDot.className = 'di-dot pulsing';
        diText.innerText = 'Altitude 1.00x';

        // Включаем варп свечение
        warpGlow.className = 'warp-glow active';

        // Случайный краш
        crashPoint = parseFloat((1.50 + Math.random() * 4.30).toFixed(2));

        // Иксы появляются
        multiplierBadge.className = 'multiplier-badge visible';
        multiplierEl.innerText = 'x1.00';
        multiplierEl.className = 'multiplier';

        // Кнопка забрать с Клевером
        btnLottie.load('./gift_clover.json');
        btnText.innerText = 'Забрать (' + stars + ')';

        loop(performance.now());
    }

    function loop(currentTime) {
        if (gameState !== 'flying') return;

        const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;

        // Плавный рост икса
        const growthRate = 0.08 + (multiplier - 1.0) * 0.055;
        multiplier += growthRate * delta;

        // Звезды: 1, 2, 3, 4, 5...
        starTimer += delta * (1.8 + (multiplier - 1.0) * 1.5);
        if (starTimer >= 1) {
            stars += Math.floor(starTimer);
            starTimer = starTimer % 1;
            starsEl.innerText = stars;
            triggerHaptic('tick');
            playStarTickSound();
        }

        multiplierEl.innerText = 'x' + multiplier.toFixed(2);
        btnText.innerText = 'Забрать (' + stars + ')';
        diText.innerText = 'Altitude ' + multiplier.toFixed(2) + 'x';

        if (multiplier >= crashPoint) {
            triggerCrash();
        } else {
            animFrame = requestAnimationFrame(loop);
        }
    }

    function triggerCrash() {
        gameState = 'crashed';
        cancelAnimationFrame(animFrame);
        triggerHaptic('crash');
        playCrashSound();

        // Dynamic Island: Краш
        diDot.style.background = '#ff453a';
        diDot.style.boxShadow = '0 0 10px #ff453a';
        diDot.className = 'di-dot pulsing';
        diText.innerText = 'Signal Lost @ ' + crashPoint.toFixed(2) + 'x';

        // Гасим варп
        warpGlow.className = 'warp-glow';

        // Взрыв
        mainAnimation.load('./fire.json');
        rocketContainer.className = 'rocket-container shake';

        multiplierEl.innerText = 'ВЗОРВАЛСЯ @ x' + crashPoint.toFixed(2);
        multiplierEl.className = 'multiplier crashed-text';

        // Кнопка повтора с Пепе
        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Попробовать снова';
    }

    function claimWin() {
        if (gameState !== 'flying') return;
        gameState = 'cashed';
        cancelAnimationFrame(animFrame);
        triggerHaptic('success');
        playAppleSuccessChime();

        // Dynamic Island: Успех
        diDot.style.background = '#ffd60a';
        diDot.style.boxShadow = '0 0 10px #ffd60a';
        diDot.className = 'di-dot';
        diText.innerText = 'Collected ' + stars + ' Stars!';

        warpGlow.className = 'warp-glow';

        multiplierEl.innerText = 'ЗАБРАЛ @ x' + multiplier.toFixed(2);
        multiplierEl.className = 'multiplier cashed-text';

        btnLottie.load('./gift_pepe.json');
        btnText.innerText = 'Забрал ' + stars + ' звезд — Еще раз';
    }

    function handleButtonClick() {
        if (gameState === 'ready') {
            startFlight();
        } else if (gameState === 'flying') {
            claimWin();
        } else {
            initReadyState();
        }
    }

    // Исходное состояние при загрузке
    initReadyState();
</script>
</body>
</html>
